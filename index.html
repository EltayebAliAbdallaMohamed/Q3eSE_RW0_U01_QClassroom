<!DOCTYPE html>
<html lang="en">  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q3eSE_RW0_U01_QClassroom</title>
  <link rel="stylesheet" href="style.css">
</head>

<body role="document">

  <main role="main" aria-label="Lesson player interface">
<h1 id="lessonTitle" aria-label="Lesson title"></h1>

<div class="lesson-file-picker" style="margin: 0.75rem 0 1rem;">
  <label for="lessonFileSelect" style="display:block; font-weight:600; margin-bottom:0.35rem;">
    Lesson file:
  </label>
  <select id="lessonFileSelect" aria-label="Choose lesson JSON file" style="width: 100%; max-width: 420px; padding: 0.5rem; font-size: 1rem;">
    <option value="">Loading lesson files...</option>
  </select>
</div>

<div
  class="speaking-indicator"
  id="speakingIndicator"
  role="status"
  aria-live="polite">
  <span class="pulse">🔊</span> Speaking...
</div>

<section id="lessonMode">
